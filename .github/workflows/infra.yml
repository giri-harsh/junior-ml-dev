name: infra
on:
  push:
    branches: [main]
    paths:
      - "harness/**"
      - "apps/**"
      - "mcp_servers/**"
      - "deploy/**"
      - "tests/infra/**"
      - ".github/workflows/infra.yml"
      - "pyproject.toml"
      - "uv.lock"
  workflow_dispatch:

concurrency:
  group: infra-${{ github.ref }}
  cancel-in-progress: true

jobs:
  services:
    # Postgres store, arq worker, MinIO store, generated predict-service container, Docker sandbox
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env: {POSTGRES_USER: jmd, POSTGRES_PASSWORD: jmd, POSTGRES_DB: jmd}
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U jmd -d jmd" --health-interval 5s
          --health-timeout 3s --health-retries 20
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s
          --health-timeout 3s --health-retries 20
    env:
      INFRA_REQUIRE: "1"
      MINIO_ROOT_USER: jmdminio
      MINIO_ROOT_PASSWORD: ci-throwaway-minio-pass
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with: {enable-cache: true}
      - run: uv sync --python 3.11 --group dev --extra infra
      - name: S3 endpoint on :9000 (moto server; MinIO no longer publishes pullable images/binaries)
        run: |
          nohup uv run --with "moto[server]" moto_server -H 0.0.0.0 -p 9000 > /tmp/s3.log 2>&1 &
          for i in $(seq 1 40); do
            curl -sf http://localhost:9000/moto-api/ > /dev/null && break || sleep 3
          done
      - name: Build sandbox image
        run: docker build -t jmd-sandbox:latest deploy/sandbox
      - run: uv run pytest -m "infra and not compose" tests/infra -v --timeout 900 -p no:cacheprovider
      - if: failure()
        run: docker ps -a | tail -10

  compose:
    # real arq worker container killed mid-run, resumed, compared with an uninterrupted run
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      INFRA_REQUIRE: "1"
      ARQ_JOB_TIMEOUT: "30"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with: {enable-cache: true}
      - run: uv sync --python 3.11 --group dev --extra infra
      - name: Throwaway secrets for this run only
        run: |
          echo "JWT_SECRET=$(openssl rand -hex 24)" >> "$GITHUB_ENV"
          echo "APPROVAL_SECRET=$(openssl rand -hex 24)" >> "$GITHUB_ENV"
          echo "SCORER_SECRET=$(openssl rand -hex 24)" >> "$GITHUB_ENV"
      - run: docker compose -f deploy/compose/docker-compose.yml --profile app config --quiet
      - run: uv run pytest -m compose tests/infra -v --timeout 1500 -p no:cacheprovider
      - if: failure()
        run: |
          docker compose -f deploy/compose/docker-compose.yml --profile app ps || true
          docker compose -f deploy/compose/docker-compose.yml --profile app logs --tail 40 api worker || true
      - if: always()
        run: docker compose -f deploy/compose/docker-compose.yml --profile app down -v || true
