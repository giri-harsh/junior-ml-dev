name: ci
on:
  push:
    branches: [main]
    paths-ignore: ["docs/**", "README.md"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: astral-sh/setup-uv@v3
        with: {enable-cache: true}
      - run: uv sync --python 3.11 --group dev --extra infra
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest -q -m "not integration and not infra and not llm and not e2b" --cov --cov-fail-under=91
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  compose-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: |
          SCORER_SECRET=x JWT_SECRET=x APPROVAL_SECRET=y \
            docker compose -f deploy/compose/docker-compose.yml --profile app config --quiet

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with: {enable-cache: true}
      - run: uv sync --python 3.11 --group dev --extra infra
      - run: uv run --with bandit bandit -r apps harness mcp_servers leakage datastory trajectory benchmarks scripts -ll -q
      - run: uv run --with pip-audit pip-audit --skip-editable
      - run: uv run --with cyclonedx-bom cyclonedx-py environment --of JSON -o sbom.cdx.json
      - uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.cdx.json
