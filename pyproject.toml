[project]
name = "junior-ml-dev"
version = "0.1.0"
description = "The junior ML engineer that shows its work and catches its own mistakes."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7,<3",
    "fastapi>=0.111",
    "uvicorn>=0.30",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.1",
    "pandas>=3.1.0",
    "scikit-learn>=1.9.1",
    "pyyaml>=6.0.3",
    "pyarrow>=26.0.0",
    "numpy>=2.4.6",
    "python-multipart>=0.0.32",
    "flaml[automl]>=2.7.0",
    "lightgbm>=4.7.0",
    "mcp>=2.3.0",
    "argon2-cffi>=25.1.0",
    "pyjwt>=2.15.1",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "httpx>=0.27",
    "ruff>=0.5",
    "mypy>=1.10",
    "hypothesis>=6.100",
    "pandas-stubs>=3.0.5.260914",
    "types-pyyaml>=6.0.12.20260906",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["trajectory", "benchmarks", "apps", "datastory", "leakage", "mcp_servers", "harness"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = ["integration: needs docker compose services (run via `python scripts/tasks.py test-integration`)"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
files = ["trajectory", "benchmarks", "apps", "scripts", "datastory", "leakage", "mcp_servers", "harness"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.File", "fastapi.Form", "fastapi.Header"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E501"]

[[tool.mypy.overrides]]
module = ["sklearn.*", "flaml.*"]
ignore_missing_imports = true
