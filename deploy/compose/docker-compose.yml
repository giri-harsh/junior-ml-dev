# micro profile: postgres, redis, minio, mlflow (low RAM). full adds langfuse.
# Usage: docker compose -f deploy/compose/docker-compose.yml --profile micro up -d --wait
name: jmd

x-micro: &micro
  profiles: ["micro", "full", "app"]
  restart: unless-stopped

services:
  postgres:
    <<: *micro
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: jmd
      POSTGRES_PASSWORD: jmd
      POSTGRES_DB: jmd
    ports: ["${PG_PORT:-5432}:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    command: ["postgres", "-c", "shared_buffers=64MB", "-c", "max_connections=50"]
    mem_limit: 256m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jmd -d jmd"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    <<: *micro
    image: redis:7-alpine
    command: ["redis-server", "--maxmemory", "64mb", "--maxmemory-policy", "allkeys-lru"]
    ports: ["${REDIS_PORT:-6379}:6379"]
    mem_limit: 96m
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    <<: *micro
    build:
      context: .
      dockerfile: minio.Dockerfile
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-jmdminio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-change-me-locally}
    ports: ["${MINIO_PORT:-9000}:9000", "${MINIO_CONSOLE_PORT:-9001}:9001"]
    volumes: ["miniodata:/data"]
    mem_limit: 256m
    healthcheck:
      # `mc ready local` is the check in MinIO's container docs; the image ships mc but not curl.
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 3s
      retries: 10

  mlflow:
    <<: *micro
    build:
      context: .
      dockerfile: mlflow.Dockerfile
    command:
      - mlflow
      - server
      - --host=0.0.0.0
      - --port=5000
      - --backend-store-uri=postgresql+psycopg2://jmd:jmd@postgres:5432/jmd
      - --default-artifact-root=/mlartifacts
    ports: ["5000:5000"]
    volumes: ["mlartifacts:/mlartifacts"]
    depends_on:
      postgres: {condition: service_healthy}
    mem_limit: 512m
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:5000/health')"]
      interval: 10s
      timeout: 5s
      retries: 20

  scorer:
    <<: *micro
    build:
      context: ../..
      dockerfile: deploy/compose/scorer.Dockerfile
    environment:
      SCORER_SECRET: ${SCORER_SECRET:?set SCORER_SECRET in .env}
    ports: ["8001:8001"]
    volumes: ["scorer_data:/scorer_data:ro"]
    mem_limit: 256m

  # app profile: the API and the arq worker on top of the micro services.
  # Usage: docker compose -f deploy/compose/docker-compose.yml --profile app up -d --wait
  api:
    profiles: ["app"]
    build: &appbuild
      context: ../..
      dockerfile: deploy/compose/app.Dockerfile
    environment: &appenv
      RUNS_DATABASE_URL: postgresql+psycopg://jmd:jmd@postgres:5432/jmd
      REDIS_URL: redis://redis:6379/0
      QUEUE_BACKEND: arq
      OBJECT_STORE: minio
      MINIO_ENDPOINT: minio:9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-jmdminio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-change-me-locally}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      APPROVAL_SECRET: ${APPROVAL_SECRET:?set APPROVAL_SECRET in .env}
      ADMIN_USER: ${ADMIN_USER:-admin}
      ADMIN_PASSWORD_HASH: ${ADMIN_PASSWORD_HASH:-}
      AUDIT_DB: /app/data/audit.db
      APPROVAL_DB: /app/data/approvals.db
      DATA_TOOLS_ROOTS: /app/data
      EXPERIMENTS_DIR: /app/data/experiments
      DEPLOY_DIR: /app/data/deploy
      RUN_ROOT: /app/data/runs
      RUN_INPUT_DIR: /app/data/run_inputs
      ARQ_JOB_TIMEOUT: ${ARQ_JOB_TIMEOUT:-3600}
    command: ["uvicorn", "apps.api.main:app", "--host", "0.0.0.0", "--port", "8000"]
    ports: ["${API_PORT:-8000}:8000"]
    volumes: ["appdata:/app/data"]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      minio: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8000/healthz')"]
      interval: 10s
      timeout: 5s
      retries: 20

  worker:
    profiles: ["app"]
    build: *appbuild
    environment: *appenv
    command: ["arq", "harness.queue_arq.WorkerSettings"]
    volumes: ["appdata:/app/data"]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      minio: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "arq", "--check", "harness.queue_arq.WorkerSettings"]
      interval: 15s
      timeout: 5s
      retries: 10

  langfuse:
    profiles: ["full"]
    image: langfuse/langfuse:2
    environment:
      DATABASE_URL: postgresql://jmd:jmd@postgres:5432/jmd
      NEXTAUTH_URL: http://localhost:3000
      NEXTAUTH_SECRET: ${LANGFUSE_NEXTAUTH_SECRET:-local-dev-only}
      SALT: ${LANGFUSE_SALT:-local-dev-only}
      TELEMETRY_ENABLED: "false"
    ports: ["3000:3000"]
    depends_on:
      postgres: {condition: service_healthy}

volumes:
  appdata:
  scorer_data:
  pgdata:
  miniodata:
  mlartifacts:
